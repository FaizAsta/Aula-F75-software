name: Build and release

# Run it by hand: Actions > Build and release > Run workflow (use the main branch). It asks for two things:
#   - Version: the version to release, for example 1.5.3 (or 1.5.3-beta.1). It is written into package.json on main, so the app,
#     the file names and the release tag v<version> all say the same thing.
#   - Release type: stable (published as the latest release, so the app's updater offers it) or pre-release (marked as a
#     pre-release and never "latest"; the app's updater ignores it).
# Nothing starts by itself any more: uploading a zip to main does not build anything. After you upload a zip, run this.
#
# What it does:
#   1. unpacks the zip waiting in main's top folder (for example aula-control-v1_4_7.zip), if there is one: the project's files are
#      replaced by the zip's, and the .github folder is never touched,
#   2. sets the version you typed in package.json on main,
#   3. builds Windows (Setup + Portable) and Linux (AppImage + .deb + .tar.gz),
#   4. publishes the release v<version>. Its text is only the header "What's new in <version>": never the older sections of
#      RELEASE_NOTES.md and no description (the description is written on the release page afterwards),
#   5. moves the zip to the dev branch (it is removed from main).
#
# With no zip in main's top folder it builds main as it is (with the version you typed).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example 1.5.3)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - stable
          - pre-release
        default: stable

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      zip: ${{ steps.unpack.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unpack the zip into main
        id: unpack
        run: |
          set -euo pipefail
          # The newest zip in the top folder.
          ZIP=""
          BEST=-1
          for f in ./*.zip; do
            [ -e "$f" ] || continue
            f="${f#./}"
            T=$(git log -1 --format=%ct -- "$f")
            T=${T:-0}
            if [ "$T" -gt "$BEST" ]; then BEST=$T; ZIP="$f"; fi
          done
          if [ -z "$ZIP" ]; then
            echo "No zip in the top folder: building main as it is."
            echo "zip=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Unpacking $ZIP"
          OUT="$RUNNER_TEMP/unzipped"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"
          rm -rf "$OUT/__MACOSX"
          SRC="$OUT"
          # A zip with one folder inside (like aula-control/) is stepped into.
          if [ "$(find "$OUT" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$OUT" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$OUT" -mindepth 1 -maxdepth 1)"
          fi
          [ -f "$SRC/package.json" ] || { echo "There is no package.json in $ZIP, so it is not the app."; exit 1; }
          # Replace the project with the zip's files. Files that are not in the zip are removed from main.
          # Never touched: .git, .github and the zips in the top folder.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name '*.zip' -exec rm -rf {} +
          (cd "$SRC" && tar --exclude='./.github' -cf - .) | tar -xf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "main already has the files of $ZIP."
          else
            git commit -q -m "Unpack $ZIP"
            git push origin HEAD:main
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Set the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # "v1.5.3" and " 1.5.3 " are accepted; anything that is not a version stops the run before anything is built.
          VERSION="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "\"$INPUT_VERSION\" is not a version. Use something like 1.5.3 or 1.5.3-beta.1."
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "package.json already says $VERSION."
          else
            echo "Changing the version in package.json from $CURRENT to $VERSION."
            # Only the version line changes (the rest of package.json keeps its layout). $VERSION was checked above.
            sed -i -E '0,/"version": *"[^"]*"/s//"version": "'"$VERSION"'"/' package.json
            [ "$(node -p "require('./package.json').version")" = "$VERSION" ] || { echo "Could not set the version in package.json."; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json
            git commit -q -m "Set version $VERSION"
            git push origin HEAD:main
          fi
          if ! grep -qxF "## What's new in $VERSION" RELEASE_NOTES.md 2>/dev/null; then
            echo "::warning::RELEASE_NOTES.md has no \"## What's new in $VERSION\" header, so the app's What's new window will have nothing to show for this version."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: extract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux -- --publish never
      - name: Make the .tar.gz (the unpacked app plus the udev rule)
        run: |
          set -euo pipefail
          NAME=Aula-Control-x86_64
          [ -d dist/linux-unpacked ] || { echo "dist/linux-unpacked is missing."; exit 1; }
          rm -rf "dist/$NAME"
          mv dist/linux-unpacked "dist/$NAME"
          cp linux/99-aula-control.rules "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          rm -rf "dist/$NAME"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            linux/99-aula-control.rules
          if-no-files-found: error

  release:
    needs: [extract, windows, linux]
    # Runs when Windows built, even if Linux failed, so a Linux problem never stops the Windows update.
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.extract.outputs.sha }}
          VERSION: ${{ needs.extract.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          [ -f RELEASE_NOTES.md ] || { echo "RELEASE_NOTES.md is missing."; exit 1; }
          TAG="v$VERSION"
          # Stable is the latest release (the app's updater offers it). A pre-release is marked as one and is never the latest.
          if [ "$RELEASE_TYPE" = "pre-release" ]; then
            CREATE_FLAGS="--prerelease"
            EDIT_FLAGS="--prerelease --latest=false"
          else
            CREATE_FLAGS="--latest"
            EDIT_FLAGS="--prerelease=false --latest"
          fi
          echo "Publishing $TAG as a $RELEASE_TYPE."
          # The release text: only the header of this version, never the older sections and no description.
          printf "## What's new in %s\n" "$VERSION" > "$RUNNER_TEMP/release-body.md"
          FILES=$(find artifacts -type f)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            # A description that is already on the release page is kept; only an empty text gets the header.
            if [ -z "$(gh release view "$TAG" --json body --jq .body | tr -d '[:space:]')" ]; then
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-body.md" $EDIT_FLAGS
            else
              gh release edit "$TAG" $EDIT_FLAGS
            fi
          else
            gh release create "$TAG" $FILES --title "Aula Control $VERSION" --notes-file "$RUNNER_TEMP/release-body.md" --target "$SHA" $CREATE_FLAGS
          fi

  archive:
    needs: [extract, release]
    if: ${{ needs.release.result == 'success' && needs.extract.outputs.zip != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move the zip to the dev branch
        env:
          ZIP: ${{ needs.extract.outputs.zip }}
        run: |
          set -euo pipefail
          [ -f "$ZIP" ] || { echo "$ZIP is not in main any more, nothing to move."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$ZIP" "$RUNNER_TEMP/archive.zip"
          if git ls-remote --exit-code --heads origin dev > /dev/null 2>&1; then
            git fetch -q origin dev
            git checkout -q -B dev origin/dev
          else
            echo "There is no dev branch yet: creating it."
            git checkout -q --orphan dev
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/archive.zip" "$ZIP"
          git add "$ZIP"
          git commit -q -m "Add $ZIP" || echo "dev already has this exact zip."
          git push origin dev
          git checkout -q -f main
          git rm -q "$ZIP"
          git commit -q -m "Move $ZIP to the dev branch"
          git push origin HEAD:main
