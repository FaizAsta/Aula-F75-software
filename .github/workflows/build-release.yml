name: Build and release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Aula-Control-Setup.exe
            dist/Aula-Control-Portable.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f RELEASE_NOTES.md ] || { echo "RELEASE_NOTES.md is missing."; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          FILES=$(find artifacts -type f)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" $FILES --title "Aula Control $VERSION" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
          fi
